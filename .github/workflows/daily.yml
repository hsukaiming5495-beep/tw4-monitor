name: tw4-daily
# 每個交易日 18:30（台北）抓資料、更新網頁、推 Telegram 盤後訊號
on:
  schedule:
    - cron: "30 10 * * 1-5"   # UTC 10:30 = 台北 18:30
  workflow_dispatch:           # 手動執行（會強制推播，可用來測試）

permissions:
  contents: write

concurrency:
  group: tw4-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests yfinance pandas

      - name: 抓取資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/tw4_collector.py --out docs/tw4_data.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 計算訊號並推播 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          NOTIFY_MODE: ${{ vars.NOTIFY_MODE || 'daily' }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: node scripts/notify.js

      - name: 提交資料（更新 GitHub Pages）
        run: |
          git config user.name "tw4-bot"
          git config user.email "tw4-bot@users.noreply.github.com"
          cp docs/tw4_data.json docs/state.json /tmp/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tw4_data.json /tmp/state.json docs/
          git add docs/tw4_data.json docs/state.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main
